name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # buildozer/p4a need system tools (autotools, java, zip...) that
      # aren't installed by default on the runner. This list matches the
      # official buildozer documentation's recommendations for Ubuntu 22.04.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36"

      # Caches SDK/NDK/built packages between runs to significantly speed up builds.
      - name: Cache buildozer global + local dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK (debug)
        run: |
          yes | buildozer -v android debug

      # Explicitly inject FileProvider after the build to guarantee it works
      # regardless of p4a.hook support in the buildozer version used (see
      # buildozer_hooks.py).
      - name: Inject FileProvider into generated manifest (safety net)
        run: |
          DIST_DIR=$(find .buildozer -maxdepth 4 -type d -name "dists" | head -n1)
          if [ -n "$DIST_DIR" ]; then
            for d in "$DIST_DIR"/*; do
              echo "Patching dist: $d"
              python buildozer_hooks.py "$d" || true
            done
          else
            echo "No dists directory found; skipping (p4a hook may have handled it already)."
          fi

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find bin -name "*.apk" | head -n1)
          echo "APK at: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureCameraKivy-debug-apk
          path: bin/*.apk
          if-no-files-found: error
