name: Build Signed Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # أدوات النظام المطلوبة لـ buildozer/p4a على Ubuntu 22.04
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache lzip gawk \
            libgdbm-dev libnss3-dev libreadline-dev \
            libsqlite3-dev tk-dev libgdbm-compat-dev libc6-dev-i386

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      # كاش لتسريع البناء بين التشغيلات
      - name: Cache buildozer global + local dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-release-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-release-${{ runner.os }}-
            buildozer-${{ runner.os }}-

      # ⚠️ مهم: استخدم GitHub Secrets بدل كلمات المرور المكتوبة مباشرة
      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias camkazeq_alias -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=camkaze, OU=Dev, O=MyCompany, L=Khartoum, ST=Khartoum, C=SD" \
            -storepass mypassword123 -keypass mypassword123

      - name: Inject Absolute Keystore Path into Buildozer Spec
        run: |
          sed -i 's|.*android.keystore\s*=.*|android.keystore = ${{ github.workspace }}/release.keystore|' buildozer.spec
          sed -i 's|.*android.keystore_passwd\s*=.*|android.keystore_passwd = mypassword123|' buildozer.spec
          sed -i 's|.*android.keyalias\s*=.*|android.keyalias = camkaze_alias|' buildozer.spec
          sed -i 's|.*android.keyalias_passwd\s*=.*|android.keyalias_passwd = mypassword123|' buildozer.spec
      # بناء نسخة release موقّعة
      - name: Build APK (release, signed)
        run: |
          yes | buildozer -v android release
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: mypassword123
          P4A_RELEASE_KEYALIAS: kazemusic_alias
          P4A_RELEASE_KEYALIAS_PASSWD: mypassword123
      # حقن FileProvider بعد البناء (شبكة أمان)
      - name: Inject FileProvider into generated manifest (safety net)
        run: |
          DIST_DIR=$(find .buildozer -maxdepth 4 -type d -name "dists" | head -n1)
          if [ -n "$DIST_DIR" ]; then
            for d in "$DIST_DIR"/*; do
              echo "Patching dist: $d" 
              python buildozer_hooks.py "$d" || true
            done
          else
            echo "No dists directory found; skipping."
          fi

      - name: Locate APK/AAB
        id: apk
        run: |
          echo "--- Contents of bin/ ---"
          ls -R bin/ || echo "bin/ is empty"
          APK_PATH=$(find bin -name "*.apk" | head -n1)
          AAB_PATH=$(find bin -name "*.aab" | head -n1)
          echo "APK: $APK_PATH"
          echo "AAB: $AAB_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureCameraKivy-release-apk
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
